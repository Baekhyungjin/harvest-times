<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 - 하베스트 타임스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:#f3f4f7;color:#1b1f27;font-size:15px}
a{color:#0b3b8f;text-decoration:none}button{font:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:#0f1b33;padding:18px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
nav .brand{color:#fff;font-weight:800;font-size:18px;padding:0 20px 16px}
nav a{color:#b8c3da;padding:11px 20px;display:block}nav a.on,nav a:hover{background:#1d2e52;color:#fff}nav a.ext{margin-top:auto;font-size:13px}nav a.ext+a.ext{margin-top:0}
#main{padding:28px 32px 80px;min-width:0}
h2{margin:0 0 18px;font-size:24px}h3{margin:0 0 12px;font-size:17px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card{background:#fff;border:1px solid #e3e6ec;border-radius:8px;padding:20px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}.stats .card{margin:0}.stats small{color:#667}.stats b{display:block;font-size:34px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #eceff4;text-align:left;font-size:14px;vertical-align:middle}th{color:#667;font-weight:600;background:#fafbfc}
.act a{margin-right:10px;font-size:13px}.dng{color:#c0392b}
.b{display:inline-block;background:#0b3b8f;color:#fff;border:0;border-radius:6px;padding:9px 18px;font-weight:600}.b.line{background:#fff;color:#222;border:1px solid #c9ced8}
.muted{color:#8a93a3}.tag{background:#0b3b8f;color:#fff;border-radius:3px;padding:1px 6px;font-size:11px}.tag.t2{background:#667}
.pill{border-radius:10px;padding:2px 9px;font-size:12px;background:#eceff4}.pill.ok{background:#dff3e4;color:#1d6b35}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.filters input,.filters select{padding:9px 10px;border:1px solid #c9ced8;border-radius:6px}.filters input{min-width:220px}
.pg{display:flex;gap:12px;align-items:center;justify-content:center;padding-top:16px}
.form label{display:block;margin:14px 0 6px;font-weight:600;font-size:13px;color:#445}.form .chk{display:flex;gap:8px;align-items:center;font-weight:500}
.form input:not([type=checkbox]):not([type=file]),.form textarea,.form select{width:100%;padding:10px 11px;border:1px solid #c9ced8;border-radius:6px;font:inherit;background:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.imgrow{display:flex;gap:16px;align-items:flex-start}.imgrow>div:first-child{width:200px;height:112px;background:#eef0f4;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.imgrow img{width:100%;height:100%;object-fit:cover}.imgrow>div:last-child{flex:1;display:grid;gap:8px}
.tbar{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.tbar button{border:1px solid #c9ced8;background:#fff;border-radius:5px;padding:5px 12px}
.rte{min-height:320px;border:1px solid #c9ced8;border-radius:6px;padding:14px;line-height:1.8;background:#fff}.rte img{max-width:100%}
.bar2{margin-top:20px}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.bpv{background:#eef0f4;min-height:80px;max-height:200px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:10px;border-radius:6px}.bpv img{max-width:100%;max-height:200px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);color:#fff;padding:12px 22px;border-radius:8px;opacity:0;transition:opacity .25s;z-index:99;pointer-events:none}
body.login{background:#0f1b33;display:flex;align-items:center;justify-content:center;min-height:100vh}
.lbox{background:#fff;border-radius:12px;padding:34px 32px;width:min(380px,92vw)}.lbox h1{font-size:20px;margin:0 0 14px}.lbox .hint{background:#fff7e6;border:1px solid #ffd591;padding:8px 10px;border-radius:6px;font-size:13px}
.lbox label{display:block;margin:14px 0 6px;font-weight:600;font-size:13px}.lbox input{width:100%;padding:11px;border:1px solid #c9ced8;border-radius:6px;font:inherit}.lbox .b{width:100%;margin-top:18px;padding:12px}.err{color:#c0392b;min-height:20px;font-size:13px}
@media(max-width:860px){.shell{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:8px}nav .brand{width:100%;padding:8px 12px}nav a{padding:8px 12px}nav a.ext{margin:0}#main{padding:18px 14px 60px}.g3,.bgrid,.stats{grid-template-columns:1fr}.imgrow{flex-direction:column}table{display:block;overflow-x:auto}}
.nw{white-space:nowrap}.pill{white-space:nowrap}.act{white-space:nowrap}
@media(max-width:860px){.hm,.sp{display:none}th,td{padding:8px 6px}.nw{font-size:12px;white-space:normal;max-width:70px}.bar h2{font-size:20px}}
.form input[type=file]{width:100%;max-width:100%;min-width:0}.imgrow>div:last-child,.bgrid>*,.g3>*{min-width:0}
</style><!-- BRAND META START -->
