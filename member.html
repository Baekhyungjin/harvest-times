<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원 | 하베스트 타임스</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b2e66">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=4">
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<style>
/* member.html 전용: 모든 규칙은 .member-* 범위 */
.member-page{--m-navy:#0b3b8f;--m-navy-d:#082b6a;--m-gold:#c9a24a;--m-gold-d:#8a6a1c;--m-gold-l:#fff6dc;--m-line:#dfe3ea;--m-sub:#5b6472;--m-bg:#f5f7fb;
  width:960px;max-width:100%;margin:0 auto;padding:32px 16px 64px;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#111;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.member-page *{box-sizing:border-box}
.member-head{border-bottom:3px solid var(--m-navy);padding-bottom:14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.member-title{margin:0;font-size:30px;line-height:1.25;font-weight:800;color:var(--m-navy);letter-spacing:-.03em}
.member-title:focus{outline:none}
.member-lead{margin:6px 0 0;color:var(--m-sub);font-size:15px}
.member-userbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--m-sub)}
.member-userbar b{color:#111}
.member-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:0;list-style:none}
.member-tabs li{margin:0}
.member-tab{display:flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--m-line);border-radius:999px;background:#fff;color:#333;font-size:15px;font-weight:600;text-decoration:none}
.member-tab:hover{border-color:var(--m-navy);color:var(--m-navy)}
.member-tab[aria-current="page"]{background:var(--m-navy);border-color:var(--m-navy);color:#fff}
.member-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 24px;padding:0;list-style:none;counter-reset:mstep}
.member-step{counter-increment:mstep;position:relative;border:1px solid var(--m-line);border-radius:10px;background:#fff;padding:12px 12px 12px 46px;min-height:64px;font-size:14px;font-weight:700;color:var(--m-sub)}
.member-step::before{content:counter(mstep);position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;background:#e8ebf1;color:#555;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.member-step small{display:block;font-weight:500;font-size:12px;margin-top:2px}
.member-step.is-done{color:var(--m-navy);border-color:#b9c9e8}
.member-step.is-done::before{background:var(--m-navy);color:#fff}
.member-step.is-current{color:#111;border-color:var(--m-gold);background:var(--m-gold-l);box-shadow:0 0 0 2px rgba(201,162,74,.35)}
.member-step.is-current::before{background:var(--m-gold);color:#2b2000}
.member-card{background:#fff;border:1px solid var(--m-line);border-radius:12px;padding:24px;margin:0 0 20px}
.member-card h2{margin:0 0 6px;font-size:20px;font-weight:800;color:var(--m-navy)}
.member-card h3{margin:20px 0 8px;font-size:16px;font-weight:800}
.member-card p{margin:0 0 10px}
.member-narrow{max-width:560px}
.member-form{margin:14px 0 0}
.member-form fieldset{border:0;margin:0;padding:0;min-width:0}
.member-field{margin:0 0 16px}
.member-label{display:block;margin:0 0 6px;font-size:15px;font-weight:700}
.member-req{color:#b42318;margin-left:2px}
.member-input{display:block;width:100%;min-height:46px;padding:10px 12px;border:1px solid #b9c0cc;border-radius:8px;background:#fff;font:inherit;font-size:16px;color:#111}
textarea.member-input{min-height:120px;resize:vertical;line-height:1.6}
.member-body{min-height:260px}
.member-input:focus-visible,.member-btn:focus-visible,.member-tab:focus-visible,.member-link:focus-visible,.member-check input:focus-visible{outline:3px solid var(--m-gold);outline-offset:2px}
.member-input[aria-invalid="true"]{border-color:#b42318;background:#fff8f7}
.member-input:disabled{background:#eef0f4;color:#777}
.member-hint{margin:5px 0 0;font-size:13px;color:var(--m-sub)}
.member-err{margin:5px 0 0;font-size:13px;font-weight:600;color:#b42318;min-height:0}
.member-err:empty{display:none}
.member-check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--m-gold);background:var(--m-gold-l);border-radius:8px;font-size:14px;cursor:pointer}
.member-check input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--m-navy)}
.member-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.member-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:8px;border:1px solid var(--m-navy);background:var(--m-navy);color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
.member-btn:hover{background:var(--m-navy-d)}
.member-btn.is-gold{background:var(--m-gold);border-color:var(--m-gold);color:#2b2000}
.member-btn.is-gold:hover{background:#b8902f}
.member-btn.is-ghost{background:#fff;color:var(--m-navy)}
.member-btn.is-ghost:hover{background:#eef3fb}
.member-btn.is-small{min-height:38px;padding:0 12px;font-size:14px}
.member-btn:disabled,.member-btn[aria-disabled="true"]{background:#e8ebf1;border-color:#d0d5de;color:#6b7280;cursor:not-allowed}
.member-status{margin:14px 0 0;padding:0;font-size:14px;font-weight:600}
.member-status:not(:empty){padding:10px 12px;border-radius:8px}
.member-status.is-error{background:#fdecea;color:#9b1c1c;border:1px solid #f5c2c0}
.member-status.is-info{background:#eef3fb;color:var(--m-navy);border:1px solid #c9d7f0}
.member-notice{margin:0 0 18px;padding:12px 14px;border-radius:8px;font-size:14px;border:1px solid #c9d7f0;background:#eef3fb;color:#17325f}
.member-notice.is-warn{background:var(--m-gold-l);border-color:var(--m-gold);color:#5c4310}
.member-notice.is-ok{background:#e8f6ec;border-color:#a8d9b6;color:#14602e}
.member-divider{display:flex;align-items:center;gap:10px;margin:22px 0 14px;font-size:13px;color:var(--m-sub);font-weight:700}
.member-divider::before,.member-divider::after{content:"";flex:1;height:1px;background:var(--m-line)}
.member-social{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.member-social .member-btn{flex-direction:column;gap:2px;padding:8px 10px;min-height:56px;line-height:1.3;text-align:center}
.member-social small{font-size:12px;font-weight:600}
.member-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.member-item{border:1px solid var(--m-line);border-radius:10px;padding:14px;background:#fff}
.member-item-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.member-item-title{font-weight:800;font-size:16px}
.member-meta{margin:6px 0 0;font-size:13px;color:var(--m-sub)}
.member-badge{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:800;border:1px solid transparent}
.member-badge.is-pending{background:var(--m-gold-l);color:#7a5200;border-color:#ecd28f}
.member-badge.is-approved{background:#e3f4e8;color:#14602e;border-color:#a8d9b6}
.member-badge.is-rejected{background:#fde8e8;color:#9b1c1c;border-color:#f3b8b8}
.member-badge.is-suspended{background:#e6e8ec;color:#374151;border-color:#c5cad3}
.member-badge.is-draft{background:#eef3fb;color:var(--m-navy);border-color:#c9d7f0}
.member-empty{margin:10px 0 0;padding:16px;border:1px dashed #c3cad6;border-radius:10px;color:var(--m-sub);font-size:14px;background:var(--m-bg)}
.member-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.member-grid .member-card{margin:0}
.member-link{color:var(--m-navy);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.member-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.member-count{text-align:right}
@media(max-width:820px){.member-steps{grid-template-columns:1fr 1fr}.member-grid{grid-template-columns:1fr}}
@media(max-width:480px){
  .member-page{padding:20px 12px 48px}
  .member-title{font-size:24px}
  .member-card{padding:16px}
  .member-steps{grid-template-columns:1fr}
  .member-tab{padding:0 12px;font-size:14px}
  .member-social{grid-template-columns:1fr}
  .member-actions .member-btn{width:100%}
}
@media(prefers-reduced-motion:reduce){.member-page *{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="member"><div id="hdr"></div><div id="app"><main class="member-page" id="member-root" aria-live="polite"><p class="member-lead">회원 화면을 불러오는 중입니다.</p><noscript><p class="member-notice is-warn">회원 화면은 JavaScript가 필요합니다.</p></noscript></main></div><div id="ftr"></div>
<script src="js/config.js"></script><script src="js/sample-harvest.js"></script><script src="js/data.js?v=4"></script><script src="js/common.js?v=4"></script><script src="js/member-page.js?v=4"></script></body></html>
