name: SEO pages
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static article pages, sitemap, RSS
        run: node scripts/build-seo.cjs
      - name: Commit changes
        run: |
          git config user.name "harvest-times-seo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A news sitemap.xml rss.xml robots.txt
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "Update SEO pages"
          git push
