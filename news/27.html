<body data-page="article" data-article-id="27"><div id="hdr"></div><div id="app"><div class="wrap"><main class="art static-art"><p class="cat"><a href="list.html?s=1111">대학교 소식 </a></p><h1>치앙마이 글로벌 허브와 태안·제주·대전·동경·나갈렌드 센터</h1><p class="meta">하베스트대학교 · 2026-10-11 09:00</p><figure><img src="images/harvest/center.jpg" alt="치앙마이 글로벌 허브와 태안·제주·대전·동경·나갈렌드 센터"></figure><div class="page-body"><p>하베스트대학교의 국제교육지원은 태국 치앙마이 센터를 글로벌 허브로 삼고 있다. 홈페이지에는 국제교육지원센터로 태안, 제주, 대전, 동경, 나갈렌드 센터가 소개돼 있다.</p><p>치앙마이 센터는 선교센터 예약과 시설 안내, 치앙마이 반석교회 소개 페이지도 운영한다.</p></div><p><a href="article.html?id=27">하베스트 타임스에서 기사 보기</a></p></main></div></div><div id="ftr"></div>
