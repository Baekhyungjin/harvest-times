<body data-page="article" data-article-id="25"><div id="hdr"></div><div id="app"><div class="wrap"><main class="art static-art"><p class="cat"><a href="list.html?s=1111">대학교 소식 </a></p><h1>하베스트대학교를 후원하는 교회·기업…&quot;사역의 선순환 파트너&quot;</h1><p class="meta">하베스트대학교 · 2026-10-15 09:00</p><figure><img src="images/harvest/about3.jpg" alt="하베스트대학교를 후원하는 교회·기업…&quot;사역의 선순환 파트너&quot;"></figure><div class="page-body"><p>하베스트대학교는 홈페이지에서 대학을 후원하는 교회와 기업을 소개하며 "함께 사역의 선순환을 만들어가는 파트너"라고 밝혔다.</p><p>소개된 곳은 하베스트교회, 열방몰, 어모교회, 원주교회, 아로마테라피협회 등이다. 후원과 파트너십 참여는 대학의 선교 후원 안내에서 신청할 수 있다.</p></div><p><a href="article.html?id=25">하베스트 타임스에서 기사 보기</a></p></main></div></div><div id="ftr"></div>
